# beauwhitman.org is the Grit Triangle site: plain static pages, no build.
# The Angular portfolio in this folder is kept in the repo but not deployed.
# To bring the portfolio back, restore the previous config from git history:
#   command = "npm run build"  /  publish = "dist/portfolio-app/browser"  /  redirect /* -> /index.html 200
[build]
  command = "echo 'Static site: nothing to build'"
  publish = "public/triangle"

# Links shared while the site lived under /triangle keep working.
[[redirects]]
  from = "/triangle"
  to = "/"
  status = 301

[[redirects]]
  from = "/triangle/"
  to = "/"
  status = 301

[[redirects]]
  from = "/triangle/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/triangle/tolled.html"
  to = "/tolled.html"
  status = 301

[[redirects]]
  from = "/triangle/contact.html"
  to = "/contact.html"
  status = 301
